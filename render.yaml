# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lunor-app-studio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false   # entered in the Render dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
